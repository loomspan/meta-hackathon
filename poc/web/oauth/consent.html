<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approve Loomspan connection (POC)</title>
<link rel="stylesheet" href="../assets/poc.css">
</head>
<body>
<main>
  <h1>Approve Loomspan connection</h1>
  <noscript><p class="alert">JavaScript is required to complete this authorization.</p></noscript>

  <p id="consent-loading">Loading authorization request…</p>

  <section id="consent-signin" hidden>
    <h2>Sign in</h2>
    <p>Sign in with your Loomspan test account to review this authorization request.</p>
    <form id="signin-form">
      <label for="signin-email">Email</label>
      <input id="signin-email" name="email" type="email" autocomplete="username" required>
      <label for="signin-password">Password</label>
      <input id="signin-password" name="password" type="password" autocomplete="current-password" required>
      <p id="signin-error" class="alert" hidden></p>
      <div class="actions"><button id="signin-submit" type="submit" class="primary">Sign in</button></div>
    </form>
  </section>

  <section id="consent-details" hidden>
    <h2>Authorization request</h2>
    <p><strong>Requesting client:</strong> <span id="client-name"></span></p>
    <p id="client-meta" hidden></p>
    <p><strong>Signed in as:</strong> <span id="user-email"></span></p>
    <p><strong>Requested access:</strong></p>
    <ul id="scope-list"></ul>
    <p id="details-error" class="alert" hidden></p>
    <div class="actions">
      <button id="approve-button" type="button" class="primary" disabled>Approve</button>
      <button id="deny-button" type="button" class="danger" disabled>Deny</button>
    </div>
  </section>

  <p id="consent-deciding" hidden>Completing your decision…</p>
  <p id="consent-error" class="alert" hidden></p>
</main>
<script src="../assets/config.js"></script>
<script>
  window.setTimeout(function () {
    if (!window.__consentModuleLoaded) {
      document.getElementById('consent-loading').hidden = true;
      var box = document.getElementById('consent-error');
      box.textContent = 'The sign-in library could not be loaded. Check your connection and reload this page.';
      box.hidden = false;
    }
  }, 8000);
</script>
<script type="module" src="../assets/consent.js"></script>
</body>
</html>
